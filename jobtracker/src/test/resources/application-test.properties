# ===================================================================
# Test Profile Configuration (H2 In-Memory Database for CI/CD Tests)
# ===================================================================

spring.application.name=jobtracker-test
server.port=0

# H2 In-Memory Database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:jobtracker_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL and Dialect for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# File Upload Test Directory
file.upload-dir=target/test-uploads/resumes

# JWT Test Secret (Base64 256-bit test key)
jwt.secret=YzNkZjY3OWJmYzMwNTNkNjQ3YjY5MzEzMjNmNjQ5NjJjYmM5MjM0NjViY2Q3N2QxYzQ0YzQ4N2MwNmQ0M2M1MQ==
jwt.expiration=86400000

# CORS Test Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Gemini AI Test Defaults
gemini.api.key=
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# Mail Test Defaults
spring.mail.host=localhost
spring.mail.port=25
